<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoLingo - 视频翻译平台</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="bi bi-translate me-2"></i>
                VideoLingo
            </a>
            <div class="d-flex">
                <span class="badge bg-light text-primary">API v1.0.0</span>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-3">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-menu-button me-2"></i>
                        功能导航
                    </div>
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action active" data-tab="video-tab">
                            <i class="bi bi-play-circle me-2"></i>
                            视频处理
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" data-tab="subtitle-tab">
                            <i class="bi bi-subtitles me-2"></i>
                            字幕生成
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" data-tab="dubbing-tab">
                            <i class="bi bi-mic me-2"></i>
                            配音生成
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" data-tab="config-tab">
                            <i class="bi bi-gear me-2"></i>
                            系统设置
                        </a>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-info-circle me-2"></i>
                        系统状态
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <small class="text-muted">API状态</small>
                            <div class="d-flex align-items-center">
                                <div class="spinner-grow spinner-grow-sm text-success me-2" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <span>已连接</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <small class="text-muted">视频状态</small>
                            <div id="video-status" class="text-muted">未加载</div>
                        </div>
                        <div class="mb-3">
                            <small class="text-muted">字幕状态</small>
                            <div id="subtitle-status" class="text-muted">未生成</div>
                        </div>
                        <div>
                            <small class="text-muted">配音状态</small>
                            <div id="dubbing-status" class="text-muted">未生成</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-9">
                <!-- 视频处理面板 -->
                <div class="tab-content active" id="video-tab">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <i class="bi bi-play-circle me-2"></i>
                            视频处理
                        </div>
                        <div class="card-body">
                            <div class="text-center mb-4" id="video-preview-container">
                                <video id="video-preview" controls style="max-width: 100%; display: none;"></video>
                                <div id="no-video-message" class="alert alert-info" style="display: flex; align-items: center; justify-content: center; height: 200px;">
                                    <i class="bi bi-info-circle me-2"></i>
                                    请先上传或下载视频
                                </div>
                            </div>

                            <div>
                                <h5 class="mb-3"><i class="bi bi-youtube me-2"></i>从YouTube下载</h5>
                                <div class="input-group mb-3">
                                    <input type="text" id="youtube-url" class="form-control" placeholder="输入YouTube视频链接">
                                    <select id="resolution" class="form-select">
                                        <option value="360">360p</option>
                                        <option value="720">720p</option>
                                        <option value="1080">1080p</option>
                                        <option value="best">最佳质量</option>
                                    </select>
                                    <button id="download-btn" class="btn btn-primary">
                                        <i class="bi bi-download me-2"></i>
                                        下载
                                    </button>
                                </div>
                            </div>

                            <div>
                                <h5 class="mb-3"><i class="bi bi-upload me-2"></i>上传本地文件</h5>
                                <div class="input-group mb-3">
                                    <input type="file" id="video-upload" class="form-control" accept="video/*,audio/*">
                                    <button id="upload-btn" class="btn btn-primary">
                                        <i class="bi bi-upload me-2"></i>
                                        上传
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 字幕生成面板 -->
                <div class="tab-content" id="subtitle-tab">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <i class="bi bi-subtitles me-2"></i>
                            字幕生成
                        </div>
                        <div class="card-body">
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle me-2"></i>
                                此功能将自动生成并翻译字幕
                            </div>
                            
                            <div class="mb-4">
                                <button id="generate-subtitles-btn" class="btn btn-primary">
                                    <i class="bi bi-magic me-2"></i>
                                    生成字幕
                                </button>
                            </div>
                            
                            <div id="subtitle-progress" class="progress mb-3" style="display: none;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 配音生成面板 -->
                <div class="tab-content" id="dubbing-tab">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <i class="bi bi-mic me-2"></i>
                            配音生成
                        </div>
                        <div class="card-body">
                            <div class="alert alert-info">
                                <i class="bi bi-info-circle me-2"></i>
                                此功能将为视频生成配音
                            </div>
                            
                            <div class="mb-4">
                                <button id="generate-dubbing-btn" class="btn btn-primary">
                                    <i class="bi bi-mic me-2"></i>
                                    生成配音
                                </button>
                            </div>
                            <div id="dubbing-progress" class="progress mb-3" style="display: none;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                     role="progressbar" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 系统设置面板 -->
                <div class="tab-content" id="config-tab">
                    <div class="card mb-4">
                        <div class="card-header bg-primary text-white">
                            <i class="bi bi-gear me-2"></i>
                            系统设置
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">API密钥</label>
                                <input type="text" class="form-control" id="api-key">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">目标语言</label>
                                <input type="text" class="form-control" id="target-language">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">TTS方法</label>
                                <select class="form-select" id="tts-method">
                                    <option value="azure_tts">Azure TTS</option>
                                    <option value="openai_tts">OpenAI TTS</option>
                                    <option value="fish_tts">Fish TTS</option>
                                </select>
                            </div>
                            <button id="save-settings-btn" class="btn btn-primary">
                                <i class="bi bi-save me-2"></i>
                                保存设置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light py-4 mt-5">
        <div class="container text-center text-muted">
            <p>© 2023 VideoLingo 视频翻译平台. 保留所有权利.</p>
        </div>
    </footer>

    <!-- 通知提示 -->
    <div id="toast" class="toast align-items-center text-white bg-dark border-0 position-fixed bottom-0 end-0 m-3" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
